<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>LiveCaption</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }
body {
  font-family: 'Pretendard Variable','Noto Sans KR',sans-serif;
  user-select:none; -webkit-user-select:none;
  display:flex; flex-direction:column;
  background:#000; color:#fff;
}

/* Top bar */
.top { display:flex; align-items:center; justify-content:space-between; padding:16px 20px 8px; flex-shrink:0; }
.status-group { display:flex; align-items:center; gap:10px; }
.dot { width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,.25); transition:all .3s; }
.dot.on { background:#4ADE80; box-shadow:0 0 12px #4ADE80; animation:pulse 1.5s infinite; }
.dot.warn { background:#FBBF24; box-shadow:0 0 12px #FBBF24; animation:pulse 1.5s infinite; }
.status-text { font-size:13px; font-weight:600; letter-spacing:.5px; color:rgba(255,255,255,.4); }

/* Mode badge */
.mode-badge {
  font-size:11px; font-weight:700; letter-spacing:1px; padding:4px 10px;
  border-radius:6px; text-transform:uppercase;
}
.mode-badge.send { background:rgba(74,222,128,.15); color:#4ADE80; }
.mode-badge.receive { background:rgba(96,165,250,.15); color:#60A5FA; }

/* Caption area */
.caption-area {
  flex:1; display:flex; flex-direction:column; justify-content:center;
  align-items:center; padding:20px 24px; overflow:hidden;
}
.placeholder { font-size:20px; text-align:center; line-height:1.7; white-space:pre-line; color:rgba(255,255,255,.35); }
.caption-line {
  font-weight:700; line-height:1.4; text-align:center; word-break:keep-all;
  transition: opacity .3s;
}
.interim-line {
  font-weight:500; line-height:1.4; text-align:center; word-break:keep-all;
  color:#4ADE80; opacity:.8; margin-top:8px;
}

/* Controls */
.controls { flex-shrink:0; padding:12px 20px 28px; border-top:1px solid rgba(255,255,255,.06); }
.sizes { display:flex; gap:6px; justify-content:center; margin-bottom:14px; }
.size-btn {
  padding:6px 14px; border-radius:20px; font-size:13px; font-weight:600;
  border:none; cursor:pointer; transition:all .2s;
  background:rgba(255,255,255,.08); color:rgba(255,255,255,.4);
}
.size-btn.active { background:#4ADE80; color:#000; }
.main-btn {
  width:100%; padding:18px 0; border-radius:16px; border:none;
  font-size:20px; font-weight:700; cursor:pointer; transition:all .2s;
}
.main-btn.start { background:#4ADE80; color:#000; box-shadow:0 0 24px rgba(74,222,128,.25); }
.main-btn.stop { background:#EF4444; color:#fff; box-shadow:0 0 24px rgba(239,68,68,.4); }

/* Mode select */
.mode-select {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:100%; gap:24px; padding:40px;
}
.mode-title { font-size:28px; font-weight:700; }
.mode-sub { font-size:16px; color:rgba(255,255,255,.5); text-align:center; line-height:1.6; }
.mode-buttons { display:flex; gap:16px; width:100%; max-width:360px; }
.mode-btn {
  flex:1; padding:24px 16px; border-radius:16px; border:none;
  font-size:16px; font-weight:700; cursor:pointer; transition:all .2s;
  display:flex; flex-direction:column; align-items:center; gap:8px;
}
.mode-btn.send-btn { background:rgba(74,222,128,.15); color:#4ADE80; }
.mode-btn.recv-btn { background:rgba(96,165,250,.15); color:#60A5FA; }
.mode-btn .icon { font-size:32px; }
.mode-btn .label { font-size:13px; font-weight:500; opacity:.7; }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
</style>
</head>
<body>

<!-- Mode Select Screen -->
<div id="modeScreen" class="mode-select">
  <div class="mode-title">LiveCaption</div>
  <div class="mode-sub">통화 내용을 읽게 만든다</div>
  <div class="mode-buttons">
    <button class="mode-btn send-btn" onclick="startMode('send')">
      <span class="icon">🎙</span>
      <span>보내기</span>
      <span class="label">내가 말하는 쪽</span>
    </button>
    <button class="mode-btn recv-btn" onclick="startMode('receive')">
      <span class="icon">📖</span>
      <span>받기</span>
      <span class="label">자막 보는 쪽</span>
    </button>
  </div>
</div>

<!-- Main App Screen -->
<div id="appScreen" style="display:none; flex:1; flex-direction:column;">
  <div class="top">
    <div class="status-group">
      <div class="dot" id="dotConn"></div>
      <span class="status-text" id="statusConn">연결 중...</span>
      <div class="dot" id="dotStt" style="display:none; margin-left:8px;"></div>
      <span class="status-text" id="statusStt" style="display:none;"></span>
    </div>
    <span class="mode-badge" id="modeBadge"></span>
  </div>

  <div class="caption-area" id="captionArea">
    <div class="placeholder" id="placeholder"></div>
  </div>

  <div class="controls">
    <div class="sizes" id="sizes"></div>
    <button class="main-btn start" id="mainBtn" style="display:none;" onclick="toggleStt()">자막 시작</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ━━━ CONFIG ━━━
const SUPABASE_URL = "여기에 입력";
const SUPABASE_KEY = "여기에 입력";
const ROOM_ID = "test-room";

// ━━━ STATE ━━━
let mode = null; // 'send' | 'receive'
let listening = false;
let rec = null;
let shouldRestart = false;
let channel = null;
let lastCaption = "";
let currentSize = 'large';

const SIZES = [
  { key:'small', label:'작게', px:28 },
  { key:'medium', label:'기본', px:36 },
  { key:'large', label:'크게', px:48 },
  { key:'xlarge', label:'매우 크게', px:64 },
];

// ━━━ MODE SELECT ━━━
// Check URL param
const urlMode = new URLSearchParams(location.search).get('mode');
if (urlMode === 'send' || urlMode === 'receive') {
  startMode(urlMode);
}

function startMode(m) {
  mode = m;
  document.getElementById('modeScreen').style.display = 'none';
  const app = document.getElementById('appScreen');
  app.style.display = 'flex';

  // Badge
  const badge = document.getElementById('modeBadge');
  badge.textContent = mode === 'send' ? '보내기' : '받기';
  badge.className = 'mode-badge ' + (mode === 'send' ? 'send' : 'receive');

  // Placeholder
  document.getElementById('placeholder').textContent =
    mode === 'send' ? '아래 버튼을 눌러\n자막을 시작하세요' : '자막을 기다리는 중...';

  // Show/hide send controls
  if (mode === 'send') {
    document.getElementById('mainBtn').style.display = 'block';
    document.getElementById('dotStt').style.display = 'inline-block';
    document.getElementById('statusStt').style.display = 'inline';
    document.getElementById('statusStt').textContent = '대기';
    initStt();
  }

  // Build size buttons
  buildSizes();

  // Connect Supabase
  connectChannel();
}

// ━━━ SIZE BUTTONS ━━━
function buildSizes() {
  const el = document.getElementById('sizes');
  el.innerHTML = '';
  SIZES.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'size-btn' + (s.key === currentSize ? ' active' : '');
    btn.textContent = s.label;
    btn.dataset.key = s.key;
    btn.onclick = () => {
      currentSize = s.key;
      document.querySelectorAll('.size-btn').forEach(b => b.classList.toggle('active', b.dataset.key === s.key));
      renderCaption();
    };
    el.appendChild(btn);
  });
}

// ━━━ SUPABASE ━━━
function connectChannel() {
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  channel = supabase.channel(ROOM_ID);

  channel.on('broadcast', { event: 'caption' }, (msg) => {
    const text = msg.payload.text;
    if (text && text !== lastCaption) {
      lastCaption = text;
      renderCaption();
    }
  });

  channel.subscribe((status) => {
    const dot = document.getElementById('dotConn');
    const st = document.getElementById('statusConn');
    if (status === 'SUBSCRIBED') {
      dot.className = 'dot on';
      st.textContent = '연결됨';
    } else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') {
      dot.className = 'dot warn';
      st.textContent = '연결 끊김';
    }
  });
}

function sendCaption(text) {
  if (!channel || !text) return;
  channel.send({ type: 'broadcast', event: 'caption', payload: { text } });
}

// ━━━ RENDER ━━━
function renderCaption(interim) {
  const area = document.getElementById('captionArea');
  const px = SIZES.find(s => s.key === currentSize).px;

  if (!lastCaption && !interim) {
    const ph = mode === 'send'
      ? (listening ? '말씀해 주세요...' : '아래 버튼을 눌러\n자막을 시작하세요')
      : '자막을 기다리는 중...';
    area.innerHTML = `<div class="placeholder">${ph}</div>`;
    return;
  }

  let html = '';
  if (lastCaption) {
    html += `<div class="caption-line" style="font-size:${px}px">${lastCaption}</div>`;
  }
  if (interim) {
    html += `<div class="interim-line" style="font-size:${px * 0.8}px">${interim}</div>`;
  }
  area.innerHTML = html;
}

// ━━━ STT ━━━
function initStt() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    alert('이 브라우저는 음성 인식을 지원하지 않습니다. Chrome을 사용해 주세요.');
    return;
  }
  rec = new SR();
  rec.lang = 'ko-KR';
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 1;

  rec.onresult = (e) => {
    let finalText = '';
    let interimText = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
      else interimText += e.results[i][0].transcript;
    }
    if (finalText) {
      const trimmed = finalText.trim();
      if (trimmed && trimmed !== lastCaption) {
        lastCaption = trimmed;
        sendCaption(trimmed);
        renderCaption();
      }
    } else {
      renderCaption(interimText);
    }
  };

  rec.onerror = (e) => { if (e.error !== 'no-speech') console.error(e.error); };
  rec.onend = () => { if (shouldRestart) try { rec.start(); } catch(e){} };
}

function toggleStt() {
  if (!rec) return;
  const btn = document.getElementById('mainBtn');
  const dot = document.getElementById('dotStt');
  const st = document.getElementById('statusStt');

  if (listening) {
    shouldRestart = false;
    rec.abort();
    listening = false;
    btn.textContent = '자막 시작';
    btn.className = 'main-btn start';
    dot.className = 'dot';
    st.textContent = '대기';
    renderCaption();
  } else {
    shouldRestart = true;
    lastCaption = '';
    try { rec.start(); } catch(e){}
    listening = true;
    btn.textContent = '자막 멈춤';
    btn.className = 'main-btn stop';
    dot.className = 'dot on';
    st.textContent = '듣는 중';
    renderCaption();
  }
}
</script>
</body>
</html>
